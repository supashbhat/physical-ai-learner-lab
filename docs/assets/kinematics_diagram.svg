<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Differential-drive robot kinematics</title>
  <desc id="desc">Top-down diagram of a two-wheel robot with wheel radius r, wheel track b, left and right wheel velocities, forward speed v, and counter-clockwise yaw rate omega.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/>
      <stop offset="1" stop-color="#14212b"/>
    </linearGradient>
    <marker id="mint-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57e2c1"/>
    </marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f3b35a"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .small { font-size: 17px; fill: #aab7c2; }
      .label { font-size: 21px; fill: #eef3f6; font-weight: 650; }
      .mono { font: 23px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #d9e5e9; }
      .formula { font: 25px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #57e2c1; }
    </style>
  </defs>
  <rect width="1000" height="520" rx="26" fill="url(#bg)"/>
  <text x="54" y="58" class="small" fill="#57e2c1" letter-spacing="2">DIFFERENTIAL DRIVE · TOP VIEW</text>

  <g transform="translate(360 270)">
    <rect x="-116" y="-88" width="232" height="176" rx="42" fill="#182b35" stroke="#4a7180" stroke-width="3"/>
    <path d="M 0 -72 L 0 -12" stroke="#57e2c1" stroke-width="4" marker-end="url(#mint-arrow)"/>
    <text x="16" y="-38" class="label">forward</text>
    <rect x="-148" y="-62" width="42" height="70" rx="9" fill="#e3a15a"/>
    <rect x="106" y="-62" width="42" height="70" rx="9" fill="#e3a15a"/>
    <text x="-173" y="-78" class="small">left wheel</text>
    <text x="110" y="-78" class="small">right wheel</text>
    <circle cx="0" cy="0" r="8" fill="#f3b35a"/>
    <path d="M -106 30 H 106" stroke="#f3b35a" stroke-width="2" stroke-dasharray="6 7"/>
    <path d="M -168 8 V 92 M 168 8 V 92" stroke="#6b7b86" stroke-width="2"/>
    <path d="M -168 76 H 168" stroke="#f3b35a" stroke-width="3" marker-start="url(#amber-arrow)" marker-end="url(#amber-arrow)"/>
    <rect x="130" y="36" width="76" height="26" rx="12" fill="#f3b35a"/>
    <text x="219" y="57" class="mono">r</text>
    <path d="M 168 49 H 205" stroke="#f3b35a" stroke-width="2"/>
    <text x="0" y="121" class="mono" text-anchor="middle">track b</text>
  </g>

  <g transform="translate(645 126)">
    <text x="0" y="0" class="small" letter-spacing="1.4">BODY COMMAND</text>
    <text x="0" y="45" class="mono">v  forward speed</text>
    <text x="0" y="82" class="mono">ω  yaw rate</text>
    <text x="0" y="142" class="small" letter-spacing="1.4">WHEEL TARGETS</text>
    <text x="0" y="188" class="formula">ωL = (v − ωb/2) / r</text>
    <text x="0" y="232" class="formula">ωR = (v + ωb/2) / r</text>
    <text x="0" y="298" class="small">Positive yaw: right wheel faster.</text>
    <text x="0" y="329" class="small">Contact and slip affect actual motion.</text>
  </g>
  <text x="500" y="488" class="small" text-anchor="middle">Wheel targets are converted to bounded motor torque; MuJoCo determines the resulting pose.</text>
</svg>
